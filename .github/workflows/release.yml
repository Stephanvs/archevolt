name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: archevolt-release
  queue: max
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - run: npm install --global pnpm@12.5.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:release
      - name: Verify and stage the release
        id: prepare
        run: node scripts/release.mjs prepare
      - name: Sign in to NuGet
        if: steps.prepare.outputs.publish == 'true'
        uses: NuGet/login@v1.2.0
        id: nuget
        with:
          user: ${{ vars.NUGET_USER || 'Stephanvs' }}
      - name: Publish the verified package, symbols, and release notes
        if: steps.prepare.outputs.publish == 'true'
        run: node scripts/release.mjs publish
        env:
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
      - name: Rebuild the documentation
        run: node scripts/release.mjs docs
        env:
          DOCS_DEPLOY_HOOK_URL: ${{ secrets.DOCS_DEPLOY_HOOK_URL }}
      - name: Keep verification logs
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-verification
          path: artifacts/logs
          if-no-files-found: ignore
