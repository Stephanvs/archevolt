name: Verify

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
      - run: npm install --global pnpm@12.5.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:release
      - run: ./scripts/verify.ps1 -PackageVersion 0.2.0-ci -SourceRevisionId (git rev-parse HEAD)
      - run: pnpm run build
      - name: Keep verification logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: verification
          path: artifacts/logs
          if-no-files-found: ignore
