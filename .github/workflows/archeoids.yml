name: Publish Archeoids

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/archeoids.yml
      - samples/Archeoids/**
      - samples/Archeoids.Browser/**
  workflow_dispatch:

concurrency:
  group: archeoids-pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '11.0.x'
      - run: dotnet publish samples/Archeoids.Browser -c Release -p:CompressionEnabled=false -o artifacts/archeoids
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: artifacts/archeoids/wwwroot

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
